name: Build RXT Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -o RXT-Native-source.zip -d .

      - name: Fix minimum SDK for Shizuku
        run: |
          sed -i 's/minSdk = 23/minSdk = 24/g' RXT-Native/app/build.gradle.kts
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' RXT-Native/app/build.gradle.kts
          grep -nE 'minSdk|24' RXT-Native/app/build.gradle.kts

      - name: Build APK
        run: cd RXT-Native && gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RXT-Native-APK
          path: RXT-Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
