
name: Build RXT Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -o RXT-Native-source.zip -d .

      - name: Fix SDK, Shizuku and Kotlin
        run: |
          sed -i 's/minSdk = 23/minSdk = 24/g' RXT-Native/app/build.gradle.kts
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' RXT-Native/app/build.gradle.kts
          sed -i 's/13\.1\.5/12.2.0/g' RXT-Native/app/build.gradle.kts

          cat >> RXT-Native/app/build.gradle.kts <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          EOF

      - name: Verify Shizuku version
        run: |
          grep -n "shizuku" RXT-Native/app/build.gradle.kts
          grep -n "newProcess" RXT-Native/app/src/main/java/com/rxt/nativeprofile/MainActivity.kt

      - name: Build APK
        run: cd RXT-Native && gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RXT-Native-APK
          path: RXT-Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
