name: Build RXT Native APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip RXT-Native-source.zip -d .

      - name: Build APK
        run: cd RXT-Native && gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RXT-Native-APK
          path: RXT-Native/app/build/outputs/apk/debug/app-debug.apk
